name: Build and deploy the container to Container Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Lets every job ask GitHub for an OIDC token, which azure/login exchanges for
# an Azure access token. No password or key is stored anywhere.
permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-clo25-namn-we
  ACR_NAME: acrclo25namnwe
  CONTAINER_APP_NAME: ca-clo25-namnwe
  IMAGE_NAME: beacon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image in ACR
        run: |
          # The first build against a new registry sometimes fails with
          # ParentResourceNotFound although the registry exists. Retry before failing.
          for attempt in 1 2 3; do
            if az acr build \
              --registry "${{ env.ACR_NAME }}" \
              --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --image "${{ env.IMAGE_NAME }}:latest" \
              --file src/Beacon.Api/Dockerfile \
              .; then
              exit 0
            fi
            echo "Build failed (attempt $attempt of 3). Retrying in 20 s..."
            sleep 20
          done
          echo "az acr build failed 3 times." >&2
          exit 1

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out a new revision
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}"
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE:${{ github.sha }}"

      - name: Health check after deployment
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          chmod +x ./scripts/health-check.sh
          ./scripts/health-check.sh "https://$FQDN/health"
