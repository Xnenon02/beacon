name: Build and deploy to App Service

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.http'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-clo25-namn-we
  AZURE_WEBAPP_HOSTNAME: app-clo25-namn-we.azurewebsites.net
  AZURE_RESOURCE_GROUP: rg-clo25-namn-we      # new this week
  DOTNET_VERSION: '10.0.x'

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy the infrastructure
        run: |
          chmod +x ./scripts/deploy-infra.sh
          ./scripts/deploy-infra.sh "${{ env.AZURE_RESOURCE_GROUP }}"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Publish the app
        run: |
          dotnet publish ./src/Beacon.Api/Beacon.Api.csproj \
            --configuration Release \
            --output artifacts/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: artifacts/publish

  deploy:
    needs: [build, infra]     # was: needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (needed for the script)
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app
          path: artifacts/publish

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: artifacts/publish

      - name: Health check after deployment
        run: |
          URL="https://${{ env.AZURE_WEBAPP_HOSTNAME }}/health"
          chmod +x ./scripts/health-check.sh
          ./scripts/health-check.sh "$URL"
